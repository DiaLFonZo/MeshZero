# Radio daemon (meshtasticd) configuration for the M5Stack Cap LoRa-1262 on a
# CardputerZero. Mesh settings such as region and channels are not kept here;
# change those in the MeshZero app or with any other client.
---
Lora:
  Module: sx1262
  # The SX1262 sits on SPI0 with the kernel driving chip select (CE1), so no
  # CS pin is listed here.
  spidev: spidev0.1
  gpiochip: 0
  IRQ: 23     # DIO1
  Reset: 26
  Busy: 22
  # DIO2 drives the module's TX/RX switch and DIO3 powers its 3.0 V TCXO.
  DIO2_AS_RF_SWITCH: true
  DIO3_TCXO_VOLTAGE: 3.0
  spiSpeed: 1000000

GPS:
  # ATGM336H GNSS receiver on the cap, 115200 baud.
  SerialPath: /dev/ttyS0

I2C:
  # Bus behind the cap's Grove port; lets the daemon find I2C sensors.
  I2CDevice: /dev/i2c-1

Logging:
  LogLevel: info   # debug, info, warn, error

General:
  MaxNodes: 200
  MaxMessageQueue: 100
  # The node's identity is derived from the Wi-Fi adapter's MAC address.
  MACAddressSource: wlan0
