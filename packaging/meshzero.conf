# MeshZero service settings. Restart to apply:
#   sudo systemctl restart meshzero

# Other devices can only connect after Setup > App connection is set to Wi-Fi
# in the app, or with:  sudo -u meshzero meshzerod network on
# This is the address and port used then. Until then only this device can
# connect, on 127.0.0.1.
MESHZERO_API_BIND=0.0.0.0
MESHZERO_API_PORT=4403

# Local port the radio daemon listens on. Clients should not use it directly:
# it accepts a single connection, which the MeshZero service holds.
MESHZERO_RADIO_PORT=4404

# Set to 0 if the app reports "no LoRa cap" although the cap is attached.
# The radio is then started without looking for the cap first.
MESHZERO_CAP_DETECT=1

# Set to 1 to run /usr/bin/meshtasticd (from the upstream package, if you
# installed a newer one) instead of the copy shipped with MeshZero.
MESHZERO_USE_SYSTEM_MESHTASTICD=0
